name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-mac:
    name: Build (macOS)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          files: |
            dist/Saeng-*.dmg
            dist/Saeng-*.dmg.blockmap
            dist/Saeng-*-mac.zip
            dist/Saeng-*-mac.zip.blockmap
            dist/latest-mac.yml

  release-win:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          files: |
            dist/Saeng-*.exe
            dist/Saeng-*.exe.blockmap
            dist/latest.yml

  release-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          files: |
            dist/Saeng-*.AppImage
            dist/Saeng-*.deb
            dist/latest-linux.yml
